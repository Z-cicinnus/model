name: repository-and-model-checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check XML and missing asset report
        run: python scripts/check_repo.py
      - name: Unit tests (model tests skip without meshes)
        run: python -m pytest -q
