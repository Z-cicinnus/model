[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centaur-sim"
version = "0.1.0"
description = "Whole-body MuJoCo simulation for an AS2-W + R1-A7 centaur robot"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2,<4", "numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
